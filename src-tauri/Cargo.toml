[package]
name = "my-app"
version = "0.1.0"
description = "Aditya Privacy Shield Pro"
authors = ["you"]
edition = "2021"

[lib]
name = "my_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

fancy-regex = "0.17.0"
regex = "1.10"
once_cell = "1.19"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
